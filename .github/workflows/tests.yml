name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e ".[gpu]"
      - name: Run batch unit tests
        run: python -m pytest tests/test_batch_runner.py tests/test_weights.py tests/test_region.py -q
