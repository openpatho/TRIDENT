[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trident"
version = "0.1.0-batch"
description = "Toolkit for large-scale whole-slide image processing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "torch",
  "torchvision",
  "tqdm",
  "geopandas",
  "shapely",
  "h5py",
  "opencv-python-headless",
  "Pillow",
  "huggingface_hub",
]

[project.optional-dependencies]
gpu = ["openslide-python"]

[tool.setuptools.packages.find]
where = ["."]
include = ["trident*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
